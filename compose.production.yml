name: evolink

services:
  evolink:
    container_name: evolink-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SEND_EMAIL_HOOK_SECRET: ${SEND_EMAIL_HOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Evolink <admin@solairew.com.br>}
      INTER_CLIENT_ID: ${INTER_CLIENT_ID:-}
      INTER_CLIENT_SECRET: ${INTER_CLIENT_SECRET:-}
      INTER_PIX_KEY: ${INTER_PIX_KEY:-}
      INTER_ACCOUNT: ${INTER_ACCOUNT:-}
      INTER_ENV: ${INTER_ENV:-production}
      INTER_CERT_PATH: /run/secrets/inter/certificado.crt
      INTER_KEY_PATH: /run/secrets/inter/chave.key
    # Outside /opt/evolink so the deploy rsync --delete never touches it.
    volumes:
      - /opt/evolink-secrets/inter:/run/secrets/inter:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: n8n_default
